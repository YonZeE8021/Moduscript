<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · Moduscript</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top-bar">
    <a class="top-bar-btn" href="/index.html">← 返回首页</a>
    <div class="top-bar-spacer"></div>
  </header>
  <main class="settings-page">
    <h1>账号设置</h1>

    <section class="settings-section" id="accountSection">
      <h2>账号资料</h2>
      <p class="settings-hint">修改用户名、邮箱或密码。邮箱可留空；填写时须唯一。</p>
      <form id="profileForm" class="settings-form">
        <label>用户名<input type="text" id="profileUsername" required autocomplete="username" minlength="2" maxlength="32"></label>
        <label>邮箱（可选）<input type="email" id="profileEmail" autocomplete="email" placeholder="可留空"></label>
        <button type="submit" class="btn btn-primary">保存资料</button>
      </form>
      <form id="passwordForm" class="settings-form" style="margin-top: 1.25rem;">
        <h3 class="settings-subheading">修改密码</h3>
        <label>当前密码<input type="password" id="currentPassword" autocomplete="current-password"></label>
        <label>新密码<input type="password" id="newPassword" autocomplete="new-password" minlength="6"></label>
        <button type="submit" class="btn btn-outline">更新密码</button>
      </form>
      <div class="settings-actions-row">
        <button type="button" class="btn btn-outline" id="logoutBtn">退出登录</button>
      </div>
    </section>

    <section class="settings-section" id="knowledgeL1Section">
      <h2>规划知识水平（L1）</h2>
      <p class="settings-hint">用于规划模式的多轮问答：系统会根据您的四维粗评调整术语深度。首次规划前也会询问，此处可随时修改默认值。</p>
      <div id="knowledgeL1Body"></div>
      <button type="button" class="btn btn-primary" id="knowledgeL1SaveBtn" style="margin-top: 1rem;">保存知识水平</button>
    </section>

    <section class="settings-section" id="llmSection">
      <h2>LLM API 配置</h2>
      <p id="llmHint" class="settings-hint">加载中…</p>
      <div id="llmReadonly" class="settings-readonly" hidden></div>
      <form id="llmForm" class="settings-form" hidden>
        <label>Base URL<input type="url" id="baseUrl" placeholder="https://api.anthropic.com"></label>
        <label>API Key<input type="password" id="apiKey" placeholder="留空则不修改"></label>
        <label>Model<input type="text" id="model" placeholder="claude-sonnet-4-20250514"></label>
        <label>Subagent Model<input type="text" id="subagentModel"></label>
        <button type="submit" class="btn btn-primary">保存</button>
      </form>
    </section>
  </main>
  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="js/user-settings.js"></script>
</body>
</html>
