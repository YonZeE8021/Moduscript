# frpc — 在目标服务器（内网/NAT 后）运行
#
# 拓扑：
#   开发机 sender  →  your-frp-server.example:REMOTE_PORT  →  frp 隧道  →  本机 127.0.0.1:9001 (receiver)
#
# 注意：[common] server_port 是 frpc 连接 frps 的「控制端口」，
#       与下面 remote_port（公网数据端口）不是同一个概念。

[common]
server_addr = your-frp-server.example
server_port = 7000
token = your_frp_token

[mcmodagent_deploy]
type = tcp
local_ip = 127.0.0.1
local_port = 9001
remote_port = 9001

# 目标机：receiver 监听 127.0.0.1:9001，再启动 frpc
# 开发机：从 sender.example.json 复制 sender.json，填写 frp 公网 host 与 remote_port
